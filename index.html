<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--navy:#16294B;--blue:#2E5395;--teal:#2A9D8F;--red:#D1495B;--yel:#FFD84D;--line:#E3DFD2;--paper:#FBF8F0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#14243F;font-size:16.5px;line-height:1.65}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .hi{background:linear-gradient(104deg,transparent 2%,var(--yel) 3%,var(--yel) 96%,transparent 97%);padding:0 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(120,100,60,.06)}
  .eyebrow{font-size:11px;letter-spacing:2.5px;font-weight:800;color:var(--blue)}
  h1{font-size:26px;color:var(--navy);margin:6px 0 0}
  .btn{display:block;width:100%;border:none;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;background:var(--navy);color:#fff;font-family:inherit}
  .btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:14px;margin-right:6px}
  .btn.teal{background:var(--navy)} .btn.red{background:var(--red)}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);text-align:left}
  .btn:disabled{background:#B9C2D2;cursor:default}
  .seg{display:flex;gap:6px;background:#E8ECF4;border-radius:12px;padding:5px;margin-bottom:16px}
  .seg button{flex:1;border:none;border-radius:9px;padding:10px 4px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:var(--navy);font-family:inherit}
  .seg button.on{background:var(--navy);color:#fff}
  input,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);font-size:15px;font-family:inherit;margin:6px 0 12px}
  label{font-size:14px;font-weight:700;color:var(--navy)}
  .empty{text-align:center;color:#67728A;padding:34px 18px}
  .bar-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}
  .bar-bg{background:#EDF0F6;border-radius:8px;height:18px;overflow:hidden;margin-bottom:10px}
  .bar-fill{height:100%;border-radius:8px;transition:width .6s}
  .big .bar-label{font-size:17px}.big .bar-bg{height:26px;margin-bottom:14px}
  .muted{font-size:14px;color:#586074}
  .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:13px 14px;border-radius:10px;font-size:16.5px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--navy);font-family:inherit}
  .opt.mine{border-color:var(--blue);background:#EAF0FB}
  .opt.correct{border-color:var(--teal);background:#E6F4F1}
  .opt:disabled{cursor:default}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;margin:3px;font-family:inherit}
  .chip.on{border-color:var(--teal);background:#E6F4F1}
  .qcand{padding:8px 10px;background:#FFF8DC;border-radius:8px;margin-top:6px;font-size:14px}
  .rankrow{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line)}
  .rankrow.me{background:#FFF8DC;font-weight:800}
  .timer{font-size:22px;font-weight:800;color:var(--navy)} .timer.hot{color:var(--red)}
  .tbar{background:#EDF0F6;height:7px;border-radius:4px;margin:8px 0 14px;overflow:hidden}
  .tfill{height:100%;background:var(--teal);transition:width .4s linear}
  .foot{font-size:12px;color:#8A93A8;text-align:center;margin:10px 0 24px;line-height:1.7}
  .msg{color:var(--red);font-size:13px;font-weight:700;margin-bottom:6px}
  .bottombar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:9;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .bottombar button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;color:#67728A;font-size:12px;font-weight:700;padding:6px 2px}
  .bottombar button.on{color:var(--navy)}
  .bottombar .ico{font-size:22px;display:block;margin-bottom:2px}
  .rec{width:84px;height:84px;border-radius:50%;border:none;font-size:34px;cursor:pointer;background:var(--red);color:#fff;display:block;margin:14px auto}
  .rec.idle{background:var(--navy)}
  .beltgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .beltcell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;box-shadow:0 1px 4px rgba(120,100,60,.06)}
  .beltcell b{color:var(--navy);font-size:15px}
  .beltcell.clear{background:#FFF7E0;border-color:#E7C86A}
  .beltcell.off{opacity:.45;cursor:default}
  .wallgrid{column-count:2;column-gap:8px}
  @media (min-width:520px){.wallgrid{column-count:3}}
  .note{display:inline-block;width:100%;box-sizing:border-box;border-radius:12px;padding:10px 10px 7px;box-shadow:0 2px 6px rgba(22,41,75,.08);margin-bottom:8px;break-inside:avoid}
  .note img{max-width:100%;border-radius:8px;margin-bottom:6px;display:block}
  .note .txt{font-size:14px;font-weight:700;color:var(--navy);line-height:1.4;word-break:break-word}
  .note .who{font-size:11px;color:#67728A;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
  .note .like{border:none;background:none;cursor:pointer;font-size:13px;font-weight:700;color:#67728A;padding:2px 4px}
  .note .like.on{color:var(--red)}
  .bigcard{border-radius:18px;padding:44px 24px;text-align:center;box-shadow:0 4px 14px rgba(22,41,75,.12)}
  .bigcard .txt{font-size:28px;font-weight:800;color:var(--navy);line-height:1.5}
  .bigcard .who{margin-top:16px;color:#67728A;font-size:14px}
  .jinput{font-size:18px;text-align:center;padding:15px;border-radius:12px}
@keyframes gpulse{0%,100%{transform:scale(1);opacity:.94}50%{transform:scale(1.03);opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ── 상태 ── */
var ME=null, TAB='poll', STATE={}, MYVOTED=false, MYANS={}, TIMER=null;
var LIVEON=false;
setInterval(function(){ if(!ME||ME.role==='t')return;
  call('liveCheck',{},function(r){
    if(!r||!r.ok||r.live===LIVEON)return;
    LIVEON=r.live;
    // 라이브가 새로 시작된 경우에만 화면 전환. 그 외(종료)에는 탭 이름만 조용히 갱신
    if(LIVEON){render(true);return;}
    var bb=document.querySelector('.bottombar');
    if(bb&&TAB!=='live'){render(true);return;}
    if(bb){var lb=bb.querySelector('button[onclick*="live"]');if(lb)lb.innerHTML='<span class="ico">💬</span>지금';}
  });
},12000);

/* ── 효과음 (파일 없이 브라우저 합성) ── */
var NOTICE=false;
var LANG=(function(){try{return localStorage.getItem('malmun_lang')||'';}catch(e){return '';}})();
function setLang(v){LANG=v;try{localStorage.setItem('malmun_lang',v);}catch(e){}render();}
var SND={ctx:null,water:null,
 on:function(){try{return localStorage.getItem('snd')!=='0';}catch(e){return true;}},
 toggle:function(){try{localStorage.setItem('snd',this.on()?'0':'1');}catch(e){} if(!this.on()&&this.water)this.waterToggle(true); render();},
 ac:function(){if(!this.ctx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ctx=new A();}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
 tone:function(f0,f1,dur,type,vol,when){var c=this.ac();if(!c)return;var t=c.currentTime+(when||0);
  var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1||f0),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);},
 noise:function(dur,freq,vol,when){var c=this.ac();if(!c)return;var t=c.currentTime+(when||0);
  var n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=c.createBufferSource();s.buffer=buf;var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
  var g=c.createGain();g.gain.value=vol||0.15;s.connect(f).connect(g).connect(c.destination);s.start(t);},
 ok:function(){if(!this.on())return;this.tone(880,880,0.14,'sine',0.16);this.tone(1175,1175,0.22,'sine',0.16,0.14);},
 no:function(){if(!this.on())return;this.tone(200,150,0.3,'square',0.08);},
 belt:function(level,sid){if(!this.on())return;var S=this;
  if(sid==='joke1'||sid==='joke2'){try{var u=new SpeechSynthesisUtterance(sid==='joke1'?'하하!':'호호!');u.lang='ko-KR';u.rate=1.1;u.pitch=sid==='joke1'?1.0:1.5;speechSynthesis.cancel();speechSynthesis.speak(u);return;}catch(e){}}
  if(level==='하얀띠'){S.tone(2800,2300,0.09,'sine',0.14);S.tone(3000,2400,0.09,'sine',0.14,0.16);}
  else if(level==='노란띠'){[0,0.1,0.2].forEach(function(w){S.tone(3800,3300,0.06,'sine',0.12,w);});}
  else if(level==='초록띠'){S.tone(150,85,0.7,'sawtooth',0.12);}
  else if(level==='파란띠'){[0,0.09,0.18,0.27].forEach(function(w,i){S.tone(i%2?1400:1850,i%2?1300:1750,0.05,'square',0.08,w);});}
  else if(level==='빨간띠'){[0,0.22].forEach(function(w){S.tone(2100,1900,0.18,'triangle',0.1,w);S.tone(3400,3100,0.18,'triangle',0.07,w);S.noise(0.15,5200,0.08,w);});}
  else if(level==='검은띠'){[0,0.3].forEach(function(w){S.tone(150,55,0.28,'sine',0.3,w);S.noise(0.06,300,0.12,w);});}
  else {S.tone(660,660,0.1,'sine',0.1);}},
 waterToggle:function(forceOff){var c=this.ac();if(!c)return;
  if(this.water||forceOff){try{if(this.water){this.water.g.gain.setTargetAtTime(0.0001,c.currentTime,0.3);var w=this.water;setTimeout(function(){try{w.s.stop();}catch(e){}},900);}}catch(e){}this.water=null;render();return;}
  if(!this.on())return;
  var n=c.sampleRate*3,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<n;i++){var w0=Math.random()*2-1;last=(last+0.03*w0)/1.03;d[i]=last*2.8;}
  var s=c.createBufferSource();s.buffer=buf;s.loop=true;
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=750;
  var g=c.createGain();g.gain.value=0.0001;
  var l=c.createOscillator(),lg=c.createGain();l.frequency.value=0.18;lg.gain.value=140;l.connect(lg).connect(f.frequency);l.start();
  s.connect(f).connect(g).connect(c.destination);s.start();
  g.gain.setTargetAtTime(0.09,c.currentTime,0.6);
  this.water={s:s,g:g};render();}
};
var BARS=['#2E5395','#2A9D8F','#E9963E','#D1495B','#7B6CB2','#5C8A5C'];
var STARS=['-고자 합니다','개요 안내','우선/다음으로','-을 차지하다','-에 비해','무려/불과','자료 지시','지금까지/이상으로'];
var PRESETS=[]; // v2: 서버(스프레드시트 「설문」 시트)에서 받아 옴
var evalForm={good:'',stars:[],q:''}, pollShow=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function call(action,p,cb){google.script.run.withSuccessHandler(cb||function(){}).withFailureHandler(function(e){if(cb)cb({ok:false,msg:(e&&e.message)?e.message:'통신 실패',_fail:true});else console.log(e);}).api(action,p||{});}
function T(){return ME&&ME.role==='t';}

/* ── 폴링 ── */
function go(t){sttStop();if(WALL.timer){clearInterval(WALL.timer);WALL.timer=null;}TAB=t;if(t==='speak'){SPK.view='menu';SPK.belt=null;SPK.res=null;}if(t==='wall'){WALL.data=null;WALL.big=false;}if(t==='live'){LIVESUB='wall';WALL.data=null;WALL.big=false;}if(t==='info'){INFO.view=null;}if(t==='stats'){ST.data=null;ST.tab='sum';}tick();render();}
function tick(){ if(!ME||TAB==='prac'||TAB==='speak'||TAB==='wall'||TAB==='info'||TAB==='stats')return;
  call('state',{tab:TAB,nick:ME.nick,pin:T()?ME.pin:''},function(r){
    if(!r||!r.ok)return;
    var wasLive=liveActive(STATE); STATE=r; if(r.presets)PRESETS=r.presets;
    // [지금] 탭에서 낱말잇기를 보고 있을 때는 화면을 다시 그리지 않는다 (입력창 보호)
    if(TAB==='live'&&!liveActive(STATE)&&!wasLive)return;
    render(true);
  });
}
function liveActive(s){
  if(!s)return false;
  var c=s.eval,z=s.quiz,pl=s.poll;
  return !!((c&&c.status==='open')||(z&&(z.status==='question'||z.status==='reveal'))||(pl&&pl.status==='open'));
}
setInterval(tick,3500);
setInterval(function(){ // 퀴즈 타이머 로컬 감쇠
  if(STATE.quiz&&STATE.quiz.status==='question'){ STATE.quiz.remain=Math.max(0,STATE.quiz.remain-0.5); var el=document.getElementById('tmr'); var fb=document.getElementById('tfill');
    if(el){el.textContent=Math.ceil(STATE.quiz.remain)+'초'; el.className='timer'+(STATE.quiz.remain<=5?' hot':'');}
    if(fb){fb.style.width=(STATE.quiz.remain/(STATE.quiz.sec||20)*100)+'%'; fb.style.background=STATE.quiz.remain<=5?'var(--red)':'var(--teal)';}}
},500);

/* ── 렌더 ── */
function bar(label,count,total,color,big){var pct=total?Math.round(count/total*100):0;
 return '<div class="'+(big?'big':'')+'"><div class="bar-label"><span>'+esc(label)+'</span><span style="color:#55617A">'+count+'명 · '+pct+'%</span></div><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:'+color+';min-width:'+(count?8:0)+'px"></div></div></div>';}

/* 입력 중 보호: 사용자가 글자를 치는 동안에는 자동 갱신이 화면을 갈아엎지 않게 한다 */
function typing(){
  var a=document.activeElement;
  if(!a)return false;
  var t=(a.tagName||'').toUpperCase();
  if(t!=='INPUT'&&t!=='TEXTAREA')return false;
  return true;
}
function render(auto){
  if(auto&&typing())return;   // 자동 갱신은 입력 중이면 건너뜀 (사용자 조작에 의한 render는 그대로 실행)
  var el=document.getElementById('app');
  document.body.style.background = ME? '' : 'linear-gradient(165deg,#1E4A8F 0%,#2E6BC0 55%,#7FB0E8 100%)';
  if(!ME){ el.innerHTML=joinView(); return; }
  if(NOTICE){ el.innerHTML=noticeView(); return; }
  if(FBV){ el.innerHTML=fbView(); return; }
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px">'
   +'<div><div class="eyebrow">한국어로 배우는 한국어</div><div style="font-size:21px;font-weight:800;color:var(--navy)"><span class="hi">말문</span></div></div>'
   +'<div style="text-align:right;font-size:13px;color:#55617A"><b style="color:var(--navy)">'+esc(ME.nick)+'</b> · '+(T()?'교사':'학생')
   +'<div><a href="#" onclick="SND.toggle();return false" style="color:var(--blue);font-size:12px;margin-right:10px">'+(SND.on()?'🔊':'🔇 무음')+'</a><a href="#" onclick="ME=null;render();return false" style="color:var(--blue);font-size:12px">나가기</a></div></div></div>';
  var tabs = T()? [['stats','📊 현황'],['poll','설문'],['quiz','학습'],['eval','평가'],['wall','한마디'],['live','지금']]
              : [['prac','학습','📚'],['speak','말하기','🎙️'],['info','자료','📖'],['live',LIVEON?'수업 중!':'지금','💬']];
  if(T()){
    h+='<div class="seg">'+tabs.map(function(t){
      return '<button class="'+(TAB===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>';
  }
  h+= TAB==='stats'?statsView():TAB==='poll'?pollView():TAB==='quiz'?quizView():TAB==='eval'?evalView():TAB==='speak'?speakView():TAB==='info'?infoView():TAB==='live'?liveView():TAB==='wall'?wallView():pracView();
  if(T()) h+='<div class="card" style="background:#FDF6F6;border-color:#EAD4D4"><b style="color:var(--red);font-size:14px">수업 종료 후</b>'
   +'<div class="muted" style="margin:4px 0">학생 응답 데이터를 지웁니다 (스프레드시트 기록 포함).</div>'
   +'<button class="btn small red" onclick="if(confirm(\'모든 응답을 삭제할까요?\'))call(\'resetAll\',{pin:ME.pin},tick)">모든 활동 데이터 초기화</button></div>';
  h+='<div class="foot">말문 v50 — 왕초보에서 검은띠까지 🥋 · <a href="#" onclick="NOTICE=true;render();return false" style="color:#8A93A8">이용 안내</a> · <a href="#" onclick="FBV=true;render();return false" style="color:#8A93A8">만든이에게 한마디</a><br>© 2026 말문. All rights reserved. · 문항·해설·화면 구성의 무단 복제·전재를 금합니다 · 수업용 가상 데이터</div>';
  if(!T()){
    h+='<div style="height:70px"></div><div class="bottombar">'+tabs.map(function(t){
      return '<button class="'+(TAB===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span class="ico">'+t[2]+'</span>'+t[1]+'</button>';}).join('')+'</div>';
  }
  el.innerHTML=h;
}

var FBV=false;
function fbView(){
  return '<div class="card" style="margin-top:20px"><div class="eyebrow">만든이에게 한마디</div>'
   +'<h3 style="color:var(--navy);margin:8px 0 10px">의문·오류·개선 아이디어, 무엇이든 환영합니다</h3>'
   +'<div class="muted" style="margin-bottom:8px">보내 주신 내용은 만든이만 봅니다. (별명과 함께 전달됩니다)</div>'
   +'<textarea id="fbIn" rows="5" maxlength="500" placeholder="예: ○○ 세트 3번 문제의 정답이 이상해요 / 이런 기능이 있으면 좋겠어요"></textarea>'
   +'<div style="display:flex;gap:8px"><button class="btn small teal" style="margin:0" onclick="fbSend()">보내기</button>'
   +'<button class="btn small ghost" style="margin:0" onclick="FBV=false;render()">닫기</button></div></div>';
}
function fbSend(){
  var v=(document.getElementById('fbIn')||{}).value||'';
  if(!v.trim())return;
  call('feedback',{nick:ME?ME.nick:'',text:v.trim()},function(r){
    if(r&&r.ok){alert('전달했습니다 — 고맙습니다!');FBV=false;render();}
    else alert('전송 실패 — 다시 시도해 주세요.');
  });
}
/* ── 📊 교사용 학습 현황 (v49) ── */
var ST={data:null,loading:false,tab:'sum'};
function doBackup(){
  if(BK.busy)return;
  BK.busy=true; render();
  call('backup',{pin:ME.pin},function(r){
    BK.busy=false;
    if(!r||!r.ok){ alert('백업에 실패했습니다. 다시 시도해 주세요.'); render(); return; }
    try{
      var now=new Date();
      var stamp=now.getFullYear()+''+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2);
      var name='malmun_backup_'+stamp+'.json';
      var blob=new Blob([JSON.stringify(r.data)],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);

function pracStart(k,name){

function prKey(set){ return 'mm_pos_'+(ME&&ME.nick?ME.nick:'')+'_'+set; }
function prSave(set,qi){ try{ if(qi>0)localStorage.setItem(prKey(set),String(qi)); }catch(e){} }
function prLoad(set){ try{ var v=parseInt(localStorage.getItem(prKey(set))||'0',10); return isNaN(v)?0:v; }catch(e){ return 0; } }
function prClear(set){ try{ localStorage.removeItem(prKey(set)); }catch(e){} }
function pracResume(){ PR.resumeAsk=0; PR._retried=false; PR.qi=prLoad(PR.set); PR.q=null; pracLoad(); render(); }

function wrongGo(lv){
  var refs=(PR.wrongAll||[]).filter(function(x){ return !lv || x.level===lv; });
  if(!refs.length){PR.wrongPick=false;render();return;}
  PR.wrongPick=false; PR.passage=null; PR.resumeAsk=0; PR._retried=false;
  PR.mode='wrong'; PR.set='__wrong';
  PR.name=(lv?beltIcon(lv)+' 오답 다시 풀기':'↺ 오답 다시 풀기');
  PR.refs=refs; PR.total=refs.length; PR.qi=0; PR.correct=0; PR.infoN=0; PR.result=null; PR.q=null;

function pracRef(){return PR.mode==='wrong'?PR.refs[PR.qi]:{set:PR.set,qi:PR.qi};}
function pracLoad(retry){
  var ref=pracRef();
  PR.loadErr=false; PR.lastReq=ref;
  call('practiceQ',{set:ref.set,qi:ref.qi},function(r){
    PR.lastRes=r;
    if(!r||!r.ok){
      if((retry||0)<2){setTimeout(function(){pracLoad((retry||0)+1);},900);return;}
      PR.loadErr=true;render();return;   // 3회 실패 시 재시도 버튼 표시
    }
    if(r.done){
      // 저장해 둔 위치가 문항 수를 넘어선 경우(세트 내용이 바뀜) — 처음부터 다시 연다
      if(PR.mode==='set'&&PR.qi>0&&!PR._retried){ PR._retried=true; prClear(PR.set); PR.qi=0; PR.q=null; pracLoad(); return; }
      PR.qi=PR.total||PR.qi; render(); return;
    }
    if(PR.mode==='set')PR.total=r.total;
    PR.q={type:r.type,q:r.q,opts:r.opts,media:r.media,expl:r.expl,ja:r.ja,en:r.en,qja:r.qja,qen:r.qen};render();
  });
}
function pracCheck(i){
  if(PR.busy||PR.result)return;PR.busy=true;
  var ref=pracRef();var payload={set:ref.set,qi:ref.qi,nick:ME.nick};
  if(PR.q.type==='sa'){var v=(document.getElementById('prIn')||{}).value||'';if(!v.trim()){PR.busy=false;return;}payload.t=v.trim();
    var inp=document.getElementById('prIn');if(inp)inp.disabled=true;
  } else {
    payload.c=i;
    // 누른 보기를 즉시 강조하고 나머지를 잠가, 지연을 체감하지 않게
    var btns=document.querySelectorAll('#app .opt');
    for(var k=0;k<btns.length;k++){btns[k].style.pointerEvents='none';if(k===i){btns[k].style.background='#E7EEFB';btns[k].style.borderColor='var(--navy)';}else{btns[k].style.opacity='0.55';}}
  }
  call('check',payload,function(r){PR.busy=false;if(!r||!r.ok){PR.checkErr=true;render();return;}PR.checkErr=false;PR.result=r;if(r.correct){PR.correct++;SND.ok();}else{SND.no();}render();});
}
function pracNext(){
  if(PR.q&&PR.q.type==='info')PR.infoN=(PR.infoN||0)+1;

  if(PR.mode==='set')prSave(PR.set,PR.qi);
  if(PR.qi>=PR.total){
    if(PR.mode==='set'){var scored=PR.total-(PR.infoN||0);prClear(PR.set);call('plog',{nick:ME.nick,set:PR.set,total:scored,correct:PR.correct});}
    render();
  }
  else{pracLoad();render();}
}

var REC={rec:null,chunks:[],blob:null,url:null,busy:false,timer:null,secs:0,mime:''};
function recSupported(){return !!(navigator.mediaDevices&&window.MediaRecorder);}
function recStart(){
  if(REC.busy)return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    REC.mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
    REC.rec=new MediaRecorder(stream,REC.mime?{mimeType:REC.mime}:undefined);
    REC.chunks=[];REC.blob=null;REC.url=null;REC.busy=true;REC.secs=0;
    REC.rec.ondataavailable=function(e){if(e.data.size)REC.chunks.push(e.data);};
    REC.rec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      REC.blob=new Blob(REC.chunks,{type:REC.mime||'audio/webm'});
      REC.url=URL.createObjectURL(REC.blob);REC.busy=false;render();
    };
    REC.rec.start();
    REC.timer=setInterval(function(){REC.secs++;var el=document.getElementById('recSec');if(el)el.textContent=REC.secs+'초';if(REC.secs>=60)recStop();},1000);
    render();
  }).catch(function(){alert('마이크 사용을 허용해 주세요.');});
}
function recStop(){if(REC.rec&&REC.busy){clearInterval(REC.timer);REC.rec.stop();}}
function recReset(){REC.blob=null;REC.url=null;REC.secs=0;render();}

function ivSyl(ci,vi){
  // 한글 조합: 0xAC00 + (초성*21 + 중성)*28
  var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  var c=CHO.indexOf(IV_CONS[ci]), v=JUNG.indexOf(IV_VOW[vi]);
  if(c<0||v<0)return '';
  return String.fromCharCode(0xAC00+(c*21+v)*28);
}

var VOICE={pick:null,ready:false};
try{VOICE.pick=localStorage.getItem('mm_voice')||null;}catch(e){}
function ttsVoices(){
  try{
    var all=speechSynthesis.getVoices()||[];
    return all.filter(function(v){return /^ko/i.test(v.lang||'');});
  }catch(e){return [];}
}
function ttsBest(){
  var ko=ttsVoices(); if(!ko.length)return null;
  if(VOICE.pick){for(var i=0;i<ko.length;i++)if(ko[i].name===VOICE.pick)return ko[i];}
  // 품질 좋은 목소리 우선 (압축·저품질 제외)
  var pref=['Google','구글','Yuna','유나','Premium','Enhanced','Neural','Natural','Nuri','Sora','Heami'];
  for(var p=0;p<pref.length;p++)for(var i=0;i<ko.length;i++)
    if(ko[i].name.indexOf(pref[p])>=0 && !/compact|eloquence/i.test(ko[i].name))return ko[i];
  for(var i=0;i<ko.length;i++)if(!/compact|eloquence/i.test(ko[i].name))return ko[i];
  return ko[0];
}
function ttsPick(name){
  VOICE.pick=name||null;
  try{localStorage.setItem('mm_voice',VOICE.pick||'');}catch(e){}
}
var TTS_RATE={'왕초보':0.86,'하얀띠':0.88,'노란띠':0.95,'초록띠':0.95,'파란띠':1.0,'빨간띠':1.0,'검은띠':1.0,'쉬어가기':1.0};
function ttsRate(level,text,slow){
  var r=TTS_RATE[level]!==undefined?TTS_RATE[level]:0.92;
  var s=String(text||'').trim();
  var bare=s.replace(/\s/g,'');
  var words=s?s.split(/\s+/).length:1;
  // 낱말 하나(띄어쓰기 없음)는 늦추지 않는다 — 늦추면 음절마다 힘이 들어가 억양이 어색해짐
  if(words>=2&&bare.length<=7)r-=0.06;
  if(/[?？]\s*$/.test(s))r-=0.04;             // 의문문은 조금 더 천천히
  if(bare.length===1)r=Math.min(r,0.80);      // 낱글자만 조금 천천히
  if(slow)r=Math.min(r,0.55);                 // 🐢 천천히 버튼
  return Math.max(0.4,Math.min(1.2,r));
}
function ttsPickerHTML(){
  var ko=ttsVoices();

  var cur=ttsBest();
  var h='<div style="margin-top:10px;text-align:center">'
   +'<span class="muted" style="font-size:12px">🔊 목소리 </span>'
   +'<select onchange="ttsPick(this.value);render()" style="font-size:12px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font-family:inherit;max-width:70%">';
  for(var i=0;i<ko.length;i++){

    h+='<option value="'+esc(ko[i].name)+'"'+sel+'>'+esc(ko[i].name)+'</option>';
  }
  h+='</select><div class="muted" style="font-size:11px;margin-top:3px">소리가 딱딱하면 다른 목소리를 골라 보세요</div></div>';
  return h;
}
function tts(text,level,slow){
  try{
    var v=ttsBest();
    var rate=ttsRate(level,text,slow);
    var isQ=/[?？]\s*$/.test(String(text));
    // 문장은 반드시 한 번에 읽는다. 나눠 읽으면 중간에 끊길 때 음성 엔진이 엉켜
    // 그 다음 문장들까지 발음이 망가진다.
    speechSynthesis.cancel();
    setTimeout(function(){
      try{
        var u=new SpeechSynthesisUtterance(String(text));
        u.lang='ko-KR'; u.rate=rate; u.pitch=isQ?1.15:1.0;   // 의문문은 음높이만 살짝 위로
        if(v)u.voice=v;

}

var STT={on:false,rec:null,txt:'',t0:0};
function STTOK(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function nrm2(s){return String(s||'').replace(/[\s.,?!'"「」『』()\-·:;~…]/g,'');}
function sim(a,b){a=nrm2(a);b=nrm2(b);if(!a||!b)return 0;if(a===b)return 100;
 function g(s){var m={};for(var i=0;i<s.length-1;i++){var k=s.substr(i,2);m[k]=(m[k]||0)+1;}return m;}
 var A=g(a),B=g(b),inter=0,k;for(k in A){if(B[k])inter+=Math.min(A[k],B[k]);}
 var d=(a.length-1)+(b.length-1);return d>0?Math.min(100,Math.round(200*inter/d)):0;}
function sttBegin(onEnd){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 try{STT.rec=new SR();}catch(e){alert('이 기기에서는 음성 인식을 사용할 수 없습니다.');return;}
 STT.rec.lang='ko-KR';STT.rec.interimResults=true;STT.rec.continuous=true;
 STT.txt='';STT.on=true;STT.t0=Date.now();
 STT.rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;STT.txt=t;
  var el=document.getElementById('sttLive');if(el)el.textContent=t||'…';};

   var e=(ev&&ev.error)?String(ev.error):'error';
   if(e==='no-speech'){return;}                       // 말이 없었을 뿐 — 오류 아님
   STT.on=false;

   render();
 };
 STT.rec.onend=function(){if(STT.on){STT.on=false;onEnd(Math.max(1,Math.round((Date.now()-STT.t0)/1000)));}};

}

var MIC={ok:null,busy:false,err:null,info:null};
function micAsk(){
  if(MIC.busy)return;
  MIC.busy=true; MIC.err=null; render();          // 누르면 즉시 반응이 보이도록
  var done=function(ok,msg){ MIC.busy=false; MIC.ok=ok; MIC.err=msg||null; if(!ok)micProbe(function(i){MIC.info=i;render();}); else render(); };
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      done(false,'이 화면에서는 마이크를 켤 수 없어요.'); return;   // 예전에는 여기서 조용히 넘어가 아무 반응이 없었음
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      try{ st.getTracks().forEach(function(t){t.stop();}); }catch(e){}
      done(true);
    })['catch'](function(e){
      var n=(e&&(e.name||e.message))?String(e.name||e.message):'unknown';
      if(/NotFound|DevicesNotFound/i.test(n)) done(false,'마이크를 찾을 수 없어요.');
      else if(/NotReadable|TrackStart/i.test(n)) done(false,'다른 앱이 마이크를 쓰고 있어요.');
      else done(false,'마이크가 켜지지 않았어요.');
    });
  }catch(e){ done(false,'마이크가 켜지지 않았어요.'); }
}
function micProbe(cb){
  var info={iframe:true,perm:'확인 불가',gum:false,stt:false};

  try{ info.gum=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); }catch(e){}

        cb(info);
      })['catch'](function(){ cb(info); });

    }
  }catch(e){}

}

function guideChips(guide,txt){
 var m=String(guide||'').match(/「([^」]+)」/g);if(!m)return '';
 var toks=[];m.forEach(function(x){x.replace(/[「」]/g,'').split(/[,·\/]/).forEach(function(t){t=t.trim();if(t)toks.push(t);});});
 if(!toks.length)return '';
 var h='<div style="margin-top:8px">';
 toks.forEach(function(t){var hit=nrm2(txt).indexOf(nrm2(t))>=0;
  h+='<span class="chip '+(hit?'on':'')+'" style="cursor:default">'+(hit?'✓ ':'△ ')+esc(t)+'</span>';});
 return h+'<div class="muted" style="margin-top:4px">✓ = 이 표현이 대답에서 인식됨</div></div>';
}

     +'<div style="display:flex;gap:8px;margin-top:10px">'
     +(SPK.idx>0?'<button class="btn small ghost" onclick="SPK.idx--;SPK.res=null;recReset()">← 이전</button>':'')
     +(SPK.idx<TLIST.length-1?'<button class="btn small ghost" onclick="SPK.idx++;SPK.res=null;recReset()">다른 과제 →</button>':'')
     +'</div><div class="muted" style="margin-top:10px">인식 결과는 나만 봅니다(기록 시트에는 글자 수만 저장). 조용한 곳에서 하면 더 정확해요.</div></div>';
    return h;
  }
  if(SPK.view==='fb'){
    h+='<div class="card"><div style="display:flex;justify-content:space-between"><b style="color:var(--navy)">내 피드백</b><a href="#" class="muted" onclick="spkToMenu();return false">메뉴로</a></div>';
    if(!SPK.fb){h+='<div class="muted" style="margin-top:10px">불러오는 중…</div></div>';call('myFeedback',{nick:ME.nick},function(r){if(r&&r.ok){SPK.fb=r.list;render();}});return h;}
    if(!SPK.fb.length)h+='<div class="muted" style="margin-top:10px">아직 제출한 녹음이 없습니다. 「내 말로 하기」에서 첫 녹음을 보내 보세요!</div>';
    SPK.fb.forEach(function(f){
      h+='<div style="padding:10px;border-bottom:1px solid var(--line)"><div style="font-size:13px;color:#67728A">'+esc(f.time)+' · '+esc(f.ref)+'</div>'
       +(f.fb?'<div style="margin-top:4px;background:#FFF8DC;border-radius:8px;padding:8px">💬 '+esc(f.fb)+'</div>':'<div class="muted" style="margin-top:4px">피드백 대기 중</div>')+'</div>';
    });
    h+='</div>';
    return h;
  }
  return h;
}
function spkSubmit(){
  if(!REC.blob)return;
  var T3=SPK.lists.prompts.filter(function(x){return !SPK.belt||x.level===SPK.belt;});var t=T3[SPK.idx];
  var fr=new FileReader();
  fr.onload=function(){
    var b64=fr.result.split(',')[1];
    call('submitAudio',{nick:ME.nick,kind:'과제',ref:t.q,b64:b64,mime:REC.mime||'audio/webm'},function(r){
      if(r&&r.ok){alert('제출 완료! 피드백은 「내 피드백」에서 확인하세요.');recReset();}
      else alert((r&&r.msg)||'제출 실패 — 다시 시도해 주세요.');
    });
  };
  fr.readAsDataURL(REC.blob);
}
function speakTeacherView(){
  var h='<div class="card"><div style="display:flex;justify-content:space-between"><b style="color:var(--navy)">말하기 제출함</b>'
   +'<button class="btn small ghost" style="margin:0" onclick="SPK.subs=null;render()">새로고침</button></div>';
  if(!SPK.subs){h+='<div class="muted" style="margin-top:10px">불러오는 중…</div></div>';call('speakSubs',{pin:ME.pin},function(r){if(r&&r.ok){SPK.subs=r.subs;render();}});return h;}
  if(!SPK.subs.length)h+='<div class="muted" style="margin-top:10px">아직 제출이 없습니다.</div>';
  SPK.subs.forEach(function(s){
    h+='<div style="padding:12px 4px;border-bottom:1px solid var(--line)">'
     +'<div style="font-size:13px;color:#67728A">'+esc(s.time)+' · <b style="color:var(--navy)">'+esc(s.nick)+'</b> · '+esc(s.ref)+'</div>'
     +'<a href="'+esc(s.url)+'" target="_blank" style="color:var(--blue);font-weight:700;font-size:14px">▶ 드라이브에서 듣기</a>'
     +'<div style="display:flex;gap:6px;margin-top:6px"><input id="fb'+s.row+'" placeholder="피드백 입력" value="'+esc(s.fb)+'" style="margin:0">'
     +'<button class="btn small teal" style="margin:0;white-space:nowrap" onclick="saveFb('+s.row+')">저장</button></div></div>';
  });
  h+='<div class="muted" style="margin-top:10px">저장한 피드백은 학생의 「내 피드백」에 표시됩니다. 음성 파일은 드라이브 「말문_말하기제출」 폴더에 있습니다.</div></div>';
  return h;
}
function saveFb(row){
  var v=(document.getElementById('fb'+row)||{}).value||'';
  call('saveFeedback',{pin:ME.pin,row:row,text:v},function(r){if(r&&r.ok){var s=SPK.subs.find(function(x){return x.row===row;});if(s)s.fb=v;alert('저장했습니다.');}});
}

/* ── 오늘의 한마디 (v7) ── */
var WALL={data:null,big:false,bi:0,timer:null,busy:false};
var PASTEL=['#FFF3C4','#DFF5EC','#E7EEFB','#FDE7E9','#F0E9FB','#EAF6D9'];
function pcol(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return PASTEL[h%PASTEL.length];}
function wallView(){
  var h='';
  if(!WALL.data){h='<div class="card empty">⏳<br>담벼락 불러오는 중…</div>';
    call('wall',{nick:ME.nick},function(r){if(r&&r.ok){WALL.data=r;render();}});return h;}
  var d=WALL.data;
  var mine=d.posts.find(function(x){return x.nick===ME.nick&&x.topic===d.topic.q;});
  h+='<div class="card" style="background:linear-gradient(135deg,#16294B,#2E5395);border:none;color:#fff">'
   +'<div style="font-size:12px;letter-spacing:2px;font-weight:800;opacity:.8">오늘의 한마디</div>'
   +'<div style="font-size:21px;font-weight:800;margin:8px 0 4px">'+esc(d.topic.q)+'</div>'
   +(d.topic.ex?'<div style="font-size:13px;opacity:.75">예: '+esc(d.topic.ex)+'</div>':'')
   +'<div style="display:flex;gap:6px;margin-top:12px;align-items:center"><input id="wIn" maxlength="80" onkeydown="if(event.key===\'Enter\')wallPost()" placeholder="'+(mine?'오늘 것을 고쳐 쓸 수 있어요':'한국어로 한마디!')+'" style="margin:0;flex:1" value="'+(mine?esc(mine.text):'')+'">'
   +'<label for="wImg" style="cursor:pointer;font-size:22px;line-height:1">📷</label><input id="wImg" type="file" accept="image/*" style="display:none" onchange="wallPickImg(this)">'
   +'<button class="btn small teal" style="margin:0;white-space:nowrap" onclick="wallPost()">'+(WALL.busy?'올리는 중…':'남기기')+'</button></div>'
   +(WALL.img?'<div style="margin-top:8px;display:flex;align-items:center;gap:8px"><img src="'+WALL.img+'" style="height:52px;border-radius:8px"><a href="#" style="color:#fff;opacity:.8;font-size:13px" onclick="WALL.img=null;render();return false">사진 빼기 ✕</a></div>':'')
   +'</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px">'
   +'<span class="muted">모두의 한마디 '+d.posts.length+'개</span>'
   +'<span><button class="btn small ghost" style="margin:0" onclick="WALL.big=!WALL.big;WALL.bi=0;wallCycle();render()">'+(WALL.big?'담벼락 보기':'크게 보기')+'</button>'
   +' <button class="btn small ghost" style="margin:0" onclick="WALL.data=null;render()">새로고침</button></span></div>';
  if(!d.posts.length){h+='<div class="card empty">아직 아무도 없어요 — 첫 한마디의 주인공이 되어 보세요!</div>';return h;}
  if(WALL.big){
    var p0=d.posts[WALL.bi%d.posts.length];
    h+='<div class="bigcard" style="background:'+pcol(p0.nick)+'">'
     +(p0.img?'<img src="'+esc(p0.img)+'" referrerpolicy="no-referrer" style="max-width:100%;max-height:45vh;border-radius:12px;margin-bottom:14px">':'')
     +'<div class="txt">'+esc(p0.text)+'</div>'
     +'<div class="who">— '+esc(p0.nick)+' · '+esc(p0.topic)+'</div></div>'
     +'<div class="muted" style="text-align:center;margin-top:10px">4초마다 자동으로 넘어갑니다 ('+((WALL.bi%d.posts.length)+1)+'/'+d.posts.length+') — 수업 투영에 좋아요</div>';
    return h;
  }
  h+='<div class="wallgrid">';
  d.posts.forEach(function(x){
    var rot=((x.row%5)-2)*0.8;
    h+='<div class="note" style="background:'+pcol(x.nick)+';transform:rotate('+rot+'deg)">'
     +(x.img?'<img src="'+esc(x.img)+'" loading="lazy" referrerpolicy="no-referrer">':'')
     +'<div class="txt">'+esc(x.text)+'</div>'
     +'<div class="who"><span>'+esc(x.nick)+' · '+esc(x.time)+'</span>'
     +'<span><button class="like'+(x.liked?' on':'')+'" onclick="wallLike('+x.row+')">❤ '+x.likes+'</button>'
     +(T()?'<button class="like" onclick="if(confirm(\'삭제할까요?\'))wallDel('+x.row+')">🗑</button>':'')+'</span></div></div>';
  });
  h+='</div><div class="muted" style="text-align:center;margin-top:12px">주제는 매일 자동으로 바뀝니다 · 하루 한 번, 가볍게</div>';
  return h;
}
function wallCycle(){
  if(WALL.timer){clearInterval(WALL.timer);WALL.timer=null;}
  if(WALL.big)WALL.timer=setInterval(function(){if(TAB!=='wall'||!WALL.big){clearInterval(WALL.timer);WALL.timer=null;return;}WALL.bi++;render(true);},4000);
}
function wallPost(){
  if(WALL.busy)return;
  var v=(document.getElementById('wIn')||{}).value||'';
  if(!v.trim())return;WALL.busy=true;render();
  var payload={nick:ME.nick,text:v.trim()};
  if(WALL.img)payload.img=WALL.img.split(',')[1];
  call('postWord',payload,function(r){WALL.busy=false;
    if(r&&r.ok){WALL.img=null;WALL.data=null;render();}else{alert((r&&r.msg)||'실패 — 다시 시도해 주세요.');render();}});
}
function wallPickImg(inp){
  var f=inp.files&&inp.files[0]; inp.value=''; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var M=900, w=im.width, h=im.height;
      if(w>M||h>M){var k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      WALL.img=cv.toDataURL('image/jpeg',0.72);render();
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function wallLike(row){
  var x=WALL.data.posts.find(function(p){return p.row===row;});
  if(x){x.liked=!x.liked;x.likes+=x.liked?1:-1;render();}
  call('likeWord',{nick:ME.nick,row:row});
}
function wallDel(row){call('delWord',{pin:ME.pin,row:row},function(){WALL.data=null;render();});}

/* 시작 */
try{var sv=localStorage.getItem('live_nick');}catch(e){var sv=null;}
render();
call('wall',{},function(r){if(r&&r.ok&&!ME){var el=document.getElementById('jTopic');if(el)el.innerHTML='💬 오늘의 한마디: <b style="color:#FFE98A">'+esc(r.topic.q)+'</b>';}});
if(sv){var el=setInterval(function(){var i=document.getElementById('jnick');if(i){i.value=sv;clearInterval(el);}},200);}
</script>
